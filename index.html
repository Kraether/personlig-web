<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal portfolio – choose your language / Personlig portefølje – vælg dit sprog">
  <title>Personal portfolio</title>
  <link rel="stylesheet" href="assets/style.css?v=20260426">
  <style>
    .lang-select {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-top: 2rem;
    }
    .lang-select a {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 500;
    }
  </style>
  <script>
    (function () {
      var userLang = (navigator.language || '').toLowerCase();
      if (userLang.startsWith('da')) {
        window.location.replace('da/index.html');
      } else {
        window.location.replace('en/index.html');
      }
    })();
  </script>
</head>
<body>
  <main class="page-shell" id="top">
    <section class="hero">
      <div class="hero-content">
        <h1>Choose your language / Vælg dit sprog</h1>
        <div class="lang-select">
          <a href="en/index.html">English</a>
          <a href="da/index.html">Dansk</a>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/script.js?v=20260422"></script>
</body>
</html>
